name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend — lint, unit & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Vitest 4 requires Node >= 22.12; Vite 8 needs the same floor.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Unit tests (Vitest)
        run: npm run test
      - run: npm run build

  e2e:
    name: E2E — Playwright (real backend, demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: npm install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # The Playwright config itself starts uvicorn (demo env, CARBONX_SKIP_DOTENV=1)
      # and the Vite dev server, so this exercises the real /py-api proxy path.
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    env:
      # Keep external services off during tests; the test suite is hermetic.
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      VITE_SUPABASE_URL: ""
      VITE_SUPABASE_ANON_KEY: ""
      CARBONX_ALLOW_DEV_OTP: "1"
      CARBONX_TEST_LIVE_DB: "0"
      CARBONX_PAYMENTS_PROVIDER: "simulated"
      JWT_SECRET_KEY: "ci-test-secret-key-do-not-use-in-production-random-value-32chars"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run test suite
        working-directory: backend
        run: python -m unittest discover tests -v
