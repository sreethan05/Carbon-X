name: Docker CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-compose:
    name: Validate Compose Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate production docker-compose.yml
        run: docker compose config
      - name: Validate development overlay (merged with the base project)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate-compose
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: carbonx-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Python Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: carbonx-backend-py:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure Smart Contract Artifacts Exist
        run: |
          mkdir -p blockchain/artifacts/contracts

      - name: Build Blockchain Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.node
          push: false
          tags: carbonx-backend-bc:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

