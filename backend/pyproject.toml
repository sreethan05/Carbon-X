[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonx-backend"
version = "1.0.0"
description = "CarbonX FastAPI backend — satellite-verified carbon credits for smallholder farmers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CarbonX Team", email = "team@carbonx.example"}
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Mirrors backend/requirements.txt (the authoritative deploy set). Do not
# add entries here that requirements.txt does not have — CI installs from
# requirements.txt, so drift means `pip install ./backend` breaks builds.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=5.0.0",
    "supabase>=2.0.0",
    "httpx>=0.27.0",
    "earthengine-api>=0.1.390",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "twilio>=9.12.0",
    "pillow>=10.0.0",
    "azure-ai-documentintelligence>=1.0.0",
    "python-multipart>=0.0.32",
    "pytesseract>=0.3.10",
    "scikit-learn>=1.3.0",
    "imagehash>=4.3.0",
    "rapidfuzz>=3.14.5",
    "reportlab>=5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
    "ruff>=0.1.0",
    "mypy>=1.5",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
namespace_packages = true

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "W"]
ignore = ["E501", "B008", "C408"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S113", "PLP004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Test"]
python_functions = ["test_*"]
