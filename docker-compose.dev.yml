# docker-compose.dev.yml — LOCAL DEVELOPMENT OVERLAY ONLY.
#
# Usage:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Republishes the internal-only services on the developer's loopback so
# local tooling (curl, redis-cli, direct uvicorn comparisons) can reach them.
# Nothing here weakens Redis auth — the same CARBONX_REDIS_PASSWORD default
# is still required by all clients.
#
# NEVER use this overlay on a server: production must keep the base
# docker-compose.yml topology (frontend as the single published entry
# point; backend, blockchain and Redis reachable only over the docker
# network).
services:
  backend-py:
    ports:
      - "127.0.0.1:8000:8000"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
